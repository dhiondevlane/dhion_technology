
name: React Vite - Dhion Server Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React Vite app
        run: npm run build

     
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DHION_SSH_PRIVATE_KEY_B64 }}
          SERVER_HOST: ${{ secrets.DHION_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts


      - name: Deploy to Dhion website
        env:
          SERVER_HOST: ${{ secrets.DHION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.DHION_SERVER_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${SERVER_USER}@${SERVER_HOST}:/var/www/dhion/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
